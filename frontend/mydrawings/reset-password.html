<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#070b14">
  <meta name="color-scheme" content="dark">
  <title>Reset company password — My Drawings</title>
  <link rel="icon" href="/favicon_io/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/mydrawings/mydrawings.css">
</head>
<body>
  <div class="md-app">
    <section class="md-screen md-pin md-register is-active" aria-label="Reset company password">
      <p class="md-pin-brand">My Drawings</p>
      <h2>Reset company password</h2>
      <p class="md-pin-hint" id="rp-hint">Choose a new password and enter one site code from this company.</p>
      <form class="md-reg-form" id="rp-form" autocomplete="on" hidden>
        <label class="mg-field">
          <span>New password</span>
          <input id="rp-password" type="password" minlength="8" maxlength="120" autocomplete="new-password" required>
        </label>
        <label class="mg-field">
          <span>Repeat password</span>
          <input id="rp-password-2" type="password" minlength="8" maxlength="120" autocomplete="new-password" required>
        </label>
        <label class="mg-field">
          <span>Site code</span>
          <input id="rp-host" type="text" minlength="6" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="One site code from this company" required>
        </label>
        <p class="md-error" id="rp-error" role="alert"></p>
        <button type="submit" class="md-btn md-btn-primary" id="rp-submit">Save new password</button>
      </form>
      <div id="rp-done" hidden>
        <p class="md-pin-hint">Password updated. Sign in with the company email and the new password.</p>
        <a class="md-btn md-btn-primary" href="/mydrawings/?company=1">Sign in</a>
      </div>
      <p class="md-pin-actions">
        <a class="md-link" href="/mydrawings/?company=1">Back to Sign in</a>
      </p>
    </section>
  </div>
  <script src="/mydrawings/reset-password.js"></script>
</body>
</html>
